schema: spec-driven

context: |
  Language: russian
  All artifacts must be written in russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: shelf — веб-калькулятор и визуализация двух настенных полок
  (одна над другой) с подсветкой орхидей светодиодной лентой на верхней полке.
  Цель расчёта: прямой луч от ленты не попадает в глаза наблюдателя.
  Лента — протяжённый источник (есть ширина), не точка.

  Стек (v1): Vite + TypeScript + React, расчёты в браузере, Vitest,
  визуализация SVG (вид сбоку / разрез). Бэкенда нет. Статический `dist/`
  отдаётся локально (`npm run dev` / `npm run preview`) и в интернете
  (nginx / любой static host). Образ: nginx:alpine + `dist/`.

  Единицы: миллиметры и градусы. Комментарии в коде — на английском,
  UI и артефакты OpenSpec — на русском.

  Критичные инварианты при планировании:
  - Геометрия — чистые функции без DOM; TDD: сначала Vitest, потом код.
  - Лента моделируется отрезком/тонким прямоугольником с шириной; длина
    вдоль стены во 2D-разрезе не участвует (поперечное сечение).
  - Типы монтажа ленты: `downward` (на нижнюю плоскость верхней полки,
    лицом вниз) и угловые у бленды `radius` / `ell` / `triangle`.
  - Окклюдеры прямого луча: бленда верхней полки, тело нижней полки
    (нижняя может быть глубже верхней) и непрозрачное тело профиля.
  - Прямой луч в глаз = есть незаслонённый отрезок от хотя бы одной точки
    любой излучающей поверхности до глаза.
  - Состояние калькулятора живёт в URL (shareable), без аккаунтов и БД.
  - Коммиты — только по явной просьбе. Cursor attribution в коммиты не писать.

  Полный контекст (система координат, параметры, алгоритм видимости, UX):
  **openspec/project.md** — читай перед созданием артефактов.

  Проверки: `npm test` (Vitest) и `npm run build`.

rules:
  proposal:
    - "Явно отделять геометрическое ядро от UI и от хостинга."
    - "Всегда включать секцию «Не-цели» (фотометрия в люксах, полный 3D, спектр для орхидей, бэкенд/аккаунты)."
    - "Фиксировать принятые геометрические допущения (2D-разрез, протяжённый источник)."
  specs:
    - "Формат Given/When/Then для сценариев."
    - "Delta-first: ADDED/MODIFIED/REMOVED относительно текущего поведения."
    - "Наблюдаемое поведение: статус блика, лучи на схеме, синхрон слайдер↔поле, URL-состояние."
  design:
    - "Указывать затронутые модули (src/geometry, src/viz, src/ui, хостинг)."
    - "Описывать систему координат (X от стены наружу, Y вверх) и представление ленты."
    - "Не переносить расчёты в компоненты React — только чистые функции."
  tasks:
    - "Разбивать на шаги ≤2 часов; первый шаг — тесты геометрии (TDD)."
    - "Отдельно выделять ядро, SVG-схему, контролы+URL, статическую сборку/Docker."

operations:
  apply:
    guidance:
      - "Следовать TDD: тест → код → npm test."
      - "Не коммитить без явной просьбы пользователя."
      - "Не добавлять бэкенд, БД и секреты в v1."
      - "Перед завершением прогнать npm test и npm run build."
  archive:
    guidance:
      - "Кратко резюмировать обновлённые specs-домены и что проверяет калькулятор."
